name: slop-corpus-collect
on:
  schedule:
    - cron: '23 8 1,15 * *'      # ~biweekly (1st & 15th), 08:23 UTC off-minute
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect latest-model snapshot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 collect.py "$(date +%F)"
      - name: Publish snapshot
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "doloop-slop[bot]"; git config user.email "slop@doloop.io"
            git add data/; git commit -m "snapshot $(date +%F): latest-model slop corpus"; git push
          fi
