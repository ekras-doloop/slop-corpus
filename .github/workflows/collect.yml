name: slop-corpus-collect
on:
  schedule:
    - cron: '23 8 1,15 * *'      # ~biweekly (1st & 15th), 08:23 UTC off-minute
  workflow_dispatch:
    inputs:
      mode:
        description: 'latest (ongoing snapshot) or backfill (one-time historical baseline)'
        type: choice
        default: latest
        options: [latest, backfill]
permissions:
  contents: write
  actions: write                 # kill switch self-disables the cron after a year unused
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # 8 models x 20 prompts = 160 real generations ~15-25min; SIGALRM bounds true hangs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Kill switch (auto-close if unused >1yr)
        id: kill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 killswitch.py
      - name: Collect snapshot
        if: steps.kill.outputs.dormant != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 collect.py "$(date +%F)" ${{ github.event.inputs.mode == 'backfill' && 'backfill' || '' }}
      - name: Publish snapshot + pulse
        if: always() && steps.kill.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain data/ pulse.jsonl DORMANT.md)" ]; then
            git config user.name "doloop-slop[bot]"; git config user.email "slop@doloop.io"
            git add data/ pulse.jsonl DORMANT.md 2>/dev/null
            git commit -m "snapshot $(date +%F): latest-model slop corpus + interest pulse"; git push
          fi
