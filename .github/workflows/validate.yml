name: validate-contributions
on:
  pull_request:
    paths: ['human/**', 'data/community/**', 'prompts.json', 'validate.py']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate contributed rows
        run: |
          shopt -s nullglob
          files=(human/*.jsonl data/community/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo "no contribution files to validate"; exit 0; fi
          python3 validate.py "${files[@]}"
